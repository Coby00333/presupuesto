# .github/workflows/deploy.yml — publicación en GitHub Pages
# Deploya el sitio estático en https://coby00333.github.io/presupuesto/
# en cada push a main. Todas las rutas de la app son relativas, así que
# funciona sin configuración de base path.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar sitio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copiar solo los archivos del sitio
        run: |
          mkdir -p _site
          cp index.html offline.html manifest.webmanifest sw.js _site/
          cp -r icons js vendor _site/
          rm -f _site/js/types.d.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
